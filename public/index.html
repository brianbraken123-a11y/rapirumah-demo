  if (has(B.benefits)) h += sec("keunggulan","alt",`<h2>Kenapa memilih ${esc(B.name)}</h2><div class="cards c3">${B.benefits.map(b=>`<div class="card"><h3>${esc(b.t)}</h3><p>${esc(b.d)}</p></div>`).join("")}</div>`);

  if (has(B.faq)) h += sec("faq","",`<h2>Pertanyaan umum</h2><div style="margin-top:24px;max-width:760px">${B.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}</div>`);

function wire() {
  const b = document.getElementById("burger"), m = document.getElementById("menu");
  b.onclick = () => { const o = m.classList.toggle("open"); b.setAttribute("aria-expanded", o); };
  m.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { m.classList.remove("open"); b.setAttribute("aria-expanded", "false"); }));
  const f = document.getElementById("bf");
  document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>{f.elements.layanan.value=button.dataset.preset;document.querySelectorAll('[data-preset]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.getElementById('preset-note').textContent=button.dataset.preset+' dipilih. Lanjutkan di formulir pesan.';document.getElementById('booking').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){m.classList.remove('open');b.setAttribute('aria-expanded','false');}});
  const today=new Date();const localDate=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');f.elements.tanggal.min=localDate;
  f.addEventListener("submit", e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const errs = {};
    if(d.tanggal && d.tanggal < localDate) errs.tanggal="Pilih tanggal hari ini atau sesudahnya.";
    if (!d.nama.trim()) errs.nama = "Isi nama Anda.";
    if (!/^(\+?62|0)8\d{7,12}$/.test(d.hp.replace(/[\s-]/g, ""))) errs.hp = "Isi nomor WhatsApp yang valid, contoh 08123456789.";
    if (!d.layanan) errs.layanan = "Pilih salah satu layanan.";
    if (!d.lokasi.trim()) errs.lokasi = "Isi lokasi pengerjaan.";
    f.querySelectorAll(".err").forEach(el => {el.textContent = errs[el.dataset.for] || "";el.id="err-"+el.dataset.for;const input=f.elements[el.dataset.for];input.setAttribute("aria-invalid",String(Boolean(errs[el.dataset.for])));input.setAttribute("aria-describedby",el.id);});
    if (Object.keys(errs).length) { f.querySelector(`[name="${Object.keys(errs)[0]}"]`).focus(); return; }
    const lines = [`Halo, saya ${d.nama.trim()} ingin konsultasi layanan ${d.layanan}.`, `Lokasi: ${d.lokasi.trim()}`, `Nomor WhatsApp: ${d.hp.trim()}`];
    if (d.tanggal) lines.push(`Tanggal diinginkan: ${d.tanggal}`);
    if (d.catatan.trim()) lines.push(`Catatan: ${d.catatan.trim()}`);
    lines.push("Mohon informasi harga dan jadwal.");
    lines.unshift("[DEMO FIKTIF THINKABLE.PRO — bukan pesanan layanan nyata]");
    window.location.assign(wa(lines.join("\n")));
  });
}
